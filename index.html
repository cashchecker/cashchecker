<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CashcheckeR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CashcheckeR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0f;--card:#13131a;--card2:#1a1a24;--brd:#2a2a3a;--txt:#f0f0f8;--sub:#8888aa;--acc:#7c6ef8;--accl:rgba(124,110,248,.13);--grn:#2ecc8a;--red:#ff5e7a;--yel:#f5c542;--nav:#0f0f18;--shadow:0 4px 24px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#f2f4f8;--card:#fff;--card2:#f0f2f8;--brd:#dde1ef;--txt:#0f0f1a;--sub:#6b7280;--acc:#6355e8;--accl:rgba(99,85,232,.1);--grn:#059669;--red:#e53e5a;--yel:#d97706;--nav:#fff;--shadow:0 4px 24px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#app{width:100%;max-width:430px;height:100vh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;transition:background .3s}
.screen::-webkit-scrollbar{display:none}

/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--nav);border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-around;padding:0 8px 8px;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--sub);font-size:10px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:12px;transition:all .2s;font-family:inherit}
.nav-btn.active{color:var(--acc)}
.nav-btn span.ico{font-size:22px;line-height:1}
.fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7c6ef8,#a855f7);border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 24px rgba(124,110,248,.55);display:flex;align-items:center;justify-content:center;margin-top:-18px;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--brd)}
.card2{background:var(--card2);border-radius:14px;padding:14px;border:1px solid var(--brd)}
.section-title{font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}

/* INPUTS */
input,select,textarea{font-family:inherit;background:var(--card2);border:1.5px solid var(--brd);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--acc)}
select{cursor:pointer;appearance:none;-webkit-appearance:none}

/* BUTTONS */
.btn{padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;width:100%}
.btn-acc{background:linear-gradient(135deg,#7c6ef8,#a855f7);color:#fff;box-shadow:0 4px 16px rgba(124,110,248,.4)}
.btn-acc:active{transform:scale(.97)}
.btn-outline{background:var(--accl);color:var(--acc);border:2px solid var(--acc)}
.btn-red{background:linear-gradient(135deg,#ff5e7a,#ff8c42);color:#fff}
.btn-grn{background:linear-gradient(135deg,#2ecc8a,#06b6d4);color:#fff}
.btn-sm{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700}

/* CHIP */
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--brd);background:transparent;color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.chip.sel{border-color:var(--acc);background:var(--accl);color:var(--acc)}

/* TOGGLE */
.toggle{width:46px;height:26px;border-radius:13px;background:var(--brd);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--acc)}
.toggle::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on::after{left:23px}

/* PROGRESS */
.progress-bar{height:8px;border-radius:4px;background:var(--brd);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}

/* BADGE */
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase}

/* MODAL */
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;max-height:80vh;overflow-y:auto}
.modal::-webkit-scrollbar{display:none}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--brd);margin:0 auto 20px}

/* HEADER */
.hdr{padding:48px 20px 16px;background:var(--bg);display:flex;align-items:center;gap:12px}
.back-btn{width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--brd);color:var(--txt);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* TXN ITEM */
.txn-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);border-radius:15px;margin-bottom:8px;border:1px solid var(--brd)}
.txn-icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.txn-info{flex:1;min-width:0}
.txn-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-sub{font-size:11px;color:var(--sub);margin-top:2px}
.txn-amt{font-size:15px;font-weight:900;flex-shrink:0}

/* PIN */
.pin-dot{width:14px;height:14px;border-radius:50%;transition:all .2s}
.pin-key{height:64px;border-radius:18px;border:none;background:var(--card2);color:var(--txt);font-size:22px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.pin-key:active{transform:scale(.9);background:var(--accl)}

/* ANIMATIONS */
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slide-up{animation:slideUp .3s ease}
.fade-in{animation:fadeIn .3s ease}
.shake{animation:shake .4s ease}

/* BALANCE CARD */
.bal-card{background:linear-gradient(135deg,#7c6ef8,#a855f7,#ec4899);border-radius:24px;padding:24px;position:relative;overflow:hidden;margin-bottom:16px}
.bal-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.bal-card::after{content:'';position:absolute;bottom:-40px;right:40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.06)}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn{padding:12px 10px;border-radius:14px;border:2px solid var(--brd);background:var(--card);color:var(--txt);font-size:12px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .2s;font-family:inherit}
.cat-btn.sel{border-color:var(--acc);background:var(--accl);color:var(--acc)}
.cat-btn span:first-child{font-size:20px}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--brd)}
.stat-val{font-size:20px;font-weight:900}
.stat-lbl{font-size:11px;color:var(--sub);margin-top:3px}

/* ACCOUNT ITEM */
.acc-item{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-radius:16px;border:1px solid var(--brd);margin-bottom:8px}
.acc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}

/* GOAL */
.goal-card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--brd);margin-bottom:10px}

/* CHART CONTAINER */
.chart-wrap{position:relative;height:200px;margin:12px 0}

/* CURRENCY FLAG */
.curr-opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer;transition:background .2s}
.curr-opt:hover,.curr-opt.sel{background:var(--accl)}
.curr-opt.sel{color:var(--acc);font-weight:700}

/* SCROLLABLE CHIPS ROW */
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}

/* NOTIFICATION ITEM */
.notif-item{display:flex;gap:12px;padding:12px;background:var(--card2);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--acc)}

/* AMOUNT BIG INPUT */
.amt-input{background:none;border:none;outline:none;font-size:38px;font-weight:900;color:var(--txt);width:100%;font-family:inherit}

/* INFO ROW */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--brd);font-size:13px}
.info-row:last-child{border-bottom:none}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .ico{font-size:48px;margin-bottom:12px}

/* LANG GRID */
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-btn{padding:10px;border-radius:12px;border:1.5px solid var(--brd);background:transparent;color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.lang-btn.sel{border-color:var(--acc);background:var(--accl);color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════
const EXP_CATS=[
  {n:"Food & Dining",i:"🍽️",subs:["Restaurant","Groceries","Coffee","Swiggy/Zomato","Home Cooking","Bakery"]},
  {n:"Transport",i:"🚗",subs:["Fuel","Auto/Taxi","Bus/Train","Flight","Parking","Vehicle Service"]},
  {n:"Shopping",i:"🛍️",subs:["Clothes","Electronics","Home Items","Online Shopping","Beauty","Accessories"]},
  {n:"Health",i:"💊",subs:["Medicine","Doctor Visit","Hospital","Gym","Insurance","Supplements"]},
  {n:"Bills",i:"⚡",subs:["Electricity","Water","Internet","Mobile Recharge","Rent","Gas"]},

  {n:"Others",i:"📦",subs:["Gifts","Charity","Misc","EMI","Loan Repay","Investment"]},

  {n:"Others",i:"🎁",subs:["Gifts Received","Freelance","Cashback","Refund"]},

const LANGUAGES=["English","हिन्दी","മലയാളം","தமிழ்","తెలుగు","বাংলা","ਪੰਜਾਬੀ","मराठी","ગુજરાતી","اردو","عربي","ಕನ್ನಡ","Español","Français"];
const CURRENCIES=[
  {sym:"₹",name:"Indian Rupee","code":"INR",flag:"🇮🇳"},
  {sym:"$",name:"US Dollar","code":"USD",flag:"🇺🇸"},
  {sym:"€",name:"Euro","code":"EUR",flag:"🇪🇺"},
  {sym:"£",name:"British Pound","code":"GBP",flag:"🇬🇧"},
  {sym:"د.إ",name:"UAE Dirham","code":"AED",flag:"🇦🇪"},
  {sym:"ر.س",name:"Saudi Riyal","code":"SAR",flag:"🇸🇦"},
  {sym:"﷼",name:"Qatari Riyal","code":"QAR",flag:"🇶🇦"},
  {sym:"OMR",name:"Omani Rial","code":"OMR",flag:"🇴🇲"},
];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ACC_TYPES=[{t:"Cash",i:"💵"},{t:"Bank",i:"🏦"},{t:"Credit Card",i:"💳"},{t:"UPI Wallet",i:"📱"},{t:"Savings",i:"🏧"}];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const DEF_TXN=[
  {id:1,type:"income",cat:"Salary",sub:"Monthly Salary",amt:45000,acc:"Bank",note:"June Salary",date:"2025-06-01",icon:"💼"},
  {id:2,type:"expense",cat:"Bills",sub:"Rent",amt:8000,acc:"Bank",note:"June rent",date:"2025-06-01",icon:"⚡"},
  {id:3,type:"expense",cat:"Food & Dining",sub:"Swiggy/Zomato",amt:349,acc:"UPI Wallet",note:"Dinner",date:"2025-06-02",icon:"🍽️"},
  {id:4,type:"expense",cat:"Transport",sub:"Fuel",amt:1200,acc:"Cash",note:"Petrol",date:"2025-06-03",icon:"🚗"},
  {id:5,type:"income",cat:"Others",sub:"Freelance",amt:8000,acc:"Bank",note:"Web project",date:"2025-06-04",icon:"🎁"},
  {id:6,type:"expense",cat:"Shopping",sub:"Online Shopping",amt:2199,acc:"Credit Card",note:"Amazon",date:"2025-06-05",icon:"🛍️"},
  {id:7,type:"expense",cat:"Health",sub:"Medicine",amt:540,acc:"Cash",note:"Pharmacy",date:"2025-06-05",icon:"💊"},
  {id:8,type:"expense",cat:"Entertainment",sub:"OTT Subscription",amt:649,acc:"Credit Card",note:"Netflix",date:"2025-06-06",icon:"🎮"},
  {id:9,type:"expense",cat:"Food & Dining",sub:"Groceries",amt:2100,acc:"UPI Wallet",note:"Weekly grocery",date:"2025-06-07",icon:"🍽️"},
  {id:10,type:"income",cat:"Investment",sub:"Interest",amt:1200,acc:"Bank",note:"FD interest",date:"2025-06-07",icon:"📈"},
];
const DEF_ACC=[
  {id:1,name:"HDFC Bank",type:"Bank",bal:28000,icon:"🏦",color:"#2563eb"},
  {id:2,name:"Cash",type:"Cash",bal:3500,icon:"💵",color:"#16a34a"},
  {id:3,name:"HDFC Credit",type:"Credit Card",bal:-5200,icon:"💳",color:"#dc2626"},
  {id:4,name:"PhonePe",type:"UPI Wallet",bal:1800,icon:"📱",color:"#7c3aed"},
];
const DEF_BUDGET=[
  {cat:"Food & Dining",limit:5000},
  {cat:"Transport",limit:3000},
  {cat:"Shopping",limit:4000},
  {cat:"Bills",limit:12000},
  {cat:"Entertainment",limit:2000},
];
const DEF_GOALS=[
  {id:1,name:"New Phone",target:30000,saved:12000,icon:"📱",color:"#7c6ef8"},
  {id:2,name:"Emergency Fund",target:100000,saved:45000,icon:"🛡️",color:"#2ecc8a"},
  {id:3,name:"Vacation",target:50000,saved:8000,icon:"✈️",color:"#f5c542"},
];
const DEF_RECURRING=[
  {id:1,type:"expense",cat:"Bills",sub:"Rent",amt:8000,acc:"Bank",note:"Monthly Rent",freq:"Monthly",day:1,icon:"🏠"},
  {id:2,type:"expense",cat:"Entertainment",sub:"OTT Subscription",amt:649,acc:"Credit Card",note:"Netflix",freq:"Monthly",day:5,icon:"📺"},
  {id:3,type:"income",cat:"Salary",sub:"Monthly Salary",amt:45000,acc:"Bank",note:"Salary",freq:"Monthly",day:1,icon:"💼"},
  {id:4,type:"expense",cat:"Bills",sub:"Internet",amt:799,acc:"Bank",note:"Broadband",freq:"Monthly",day:10,icon:"🌐"},
];

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem("cashchecker_state")||"{}");
    return{
      screen:s.screen||"lock",
      theme:s.theme||"dark",
      lang:s.lang||"English",
      currency:s.currency||"₹",
      pin:s.pin||"1234",
      lockEnabled:s.lockEnabled!==undefined?s.lockEnabled:true,
      fpEnabled:s.fpEnabled!==undefined?s.fpEnabled:true,
      faceEnabled:s.faceEnabled!==undefined?s.faceEnabled:false,
      notifications:s.notifications!==undefined?s.notifications:true,
      backupEnabled:s.backupEnabled!==undefined?s.backupEnabled:true,
      transactions:s.transactions||[...DEF_TXN],
      accounts:s.accounts||[...DEF_ACC],
      budgets:s.budgets||[...DEF_BUDGET],
      goals:s.goals||[...DEF_GOALS],
      recurring:s.recurring||[...DEF_RECURRING],
      // transient
      pinEntry:"",
      pinError:false,
      tab:"home",
      modal:null,
      addForm:{type:"expense",cat:"",sub:"",amt:"",note:"",acc:"",date:today()},
      filterType:"all",
      filterCat:"",
      editGoal:null,
      editBudget:null,
      addAccForm:{name:"",type:"Bank",bal:"",icon:"🏦"},
      newGoalForm:{name:"",target:"",saved:"",icon:"📱"},
      newBudgetCat:"",
      newBudgetLimit:"",
      successMsg:"",
    };
  }catch(e){return loadState();}
}
function saveState(){
  const s={...S};
  // remove transient
  delete s.pinEntry;delete s.pinError;delete s.addForm;delete s.filterType;delete s.filterCat;
  delete s.modal;delete s.editGoal;delete s.editBudget;delete s.addAccForm;
  delete s.newGoalForm;delete s.newBudgetCat;delete s.newBudgetLimit;delete s.successMsg;
  s.screen="home";
  localStorage.setItem("cashchecker_state",JSON.stringify(s));
}

let S=loadState();
let chartExp=null,chartMon=null,chartLine=null;

function today(){const d=new Date();return d.toISOString().slice(0,10);}
function fmt(n){return Number(n).toLocaleString("en-IN");}
function fmtDate(ds){
  const d=new Date(ds+"T00:00:00");
  const now=new Date();
  const diff=Math.floor((now-d)/86400000);
  if(diff===0)return"Today";if(diff===1)return"Yesterday";
  if(diff<7)return MONTHS[d.getMonth()]+" "+d.getDate();
  return d.getDate()+" "+MONTHS[d.getMonth()];
}
function sym(){return S.currency;}
function totalIncome(){return S.transactions.filter(t=>t.type==="income").reduce((a,b)=>a+b.amt,0);}
function totalExpense(){return S.transactions.filter(t=>t.type==="expense").reduce((a,b)=>a+b.amt,0);}
function balance(){return totalIncome()-totalExpense();}
function catSpent(cat){return S.transactions.filter(t=>t.type==="expense"&&t.cat===cat).reduce((a,b)=>a+b.amt,0);}
function monthlyData(){
  const mo={};
  S.transactions.forEach(t=>{
    const m=t.date?t.date.slice(0,7):"";
    if(!m)return;
    if(!mo[m])mo[m]={inc:0,exp:0};
    if(t.type==="income")mo[m].inc+=t.amt;
    else mo[m].exp+=t.amt;
  });
  return mo;
}

// ═══════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  document.documentElement.setAttribute("data-theme",S.theme==="light"?"light":"");
  let html="";
  if(S.screen==="lock"){html=renderLock();}
  else{
    html=renderMain();
  }
  app.innerHTML=html;
  attachEvents();
  if(S.tab==="analytics"&&S.screen==="home") initCharts();
}

// ═══════════════════════════════════════════
// LOCK SCREEN
// ═══════════════════════════════════════════
function renderLock(){
  const dots=[0,1,2,3].map(i=>`<div class="pin-dot" style="border:2.5px solid ${i<S.pinEntry.length?(S.pinError?"var(--red)":"var(--acc)"):(S.pinError?"var(--red)":"var(--brd)")};background:${i<S.pinEntry.length?(S.pinError?"var(--red)":"var(--acc)"):"transparent"};${S.pinError?"animation:shake .4s ease":""}" ></div>`).join("");
  const keys=[1,2,3,4,5,6,7,8,9,"fp",0,"del"].map(k=>{
    if(k==="fp")return`<button class="pin-key" onclick="pinBio()" style="font-size:26px;background:var(--card2)">🫆</button>`;
    if(k==="del")return`<button class="pin-key" onclick="pinDel()" style="font-size:20px">⌫</button>`;
    return`<button class="pin-key" onclick="pinTap(${k})">${k}</button>`;
  }).join("");
  return`
<div class="screen fade-in" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;min-height:100vh">
  <div style="text-align:center;margin-bottom:36px">
    <div style="width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#7c6ef8,#a855f7);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;box-shadow:0 8px 32px rgba(124,110,248,.4)">₹</div>
    <div style="font-size:26px;font-weight:900;letter-spacing:-.5px">CashcheckeR</div>
    <div style="font-size:13px;color:var(--sub);margin-top:4px">Your Smart Money Manager</div>
  </div>

function renderMain(){
  let content="";
  if(S.screen==="add") content=renderAdd();
  else if(S.screen==="settings") content=renderSettings();
  else if(S.screen==="accounts") content=renderAccounts();
  else if(S.screen==="goals") content=renderGoals();
  else if(S.screen==="recurring") content=renderRecurring();
  else if(S.screen==="transactions") content=renderTransactions();
  else if(S.tab==="home") content=renderHome();
  else if(S.tab==="analytics") content=renderAnalytics();
  else if(S.tab==="budget") content=renderBudget();
  else if(S.tab==="more") content=renderMore();
  else content=renderHome();

  const showNav=!["add","settings","accounts","goals","recurring","transactions"].includes(S.screen);
  const tabs=[
    {id:"home",ico:"🏠",lbl:"Home"},
    {id:"analytics",ico:"📊",lbl:"Stats"},
    {id:"fab"},
    {id:"budget",ico:"🎯",lbl:"Budget"},
    {id:"more",ico:"⋯",lbl:"More"},
  ];
  const nav=showNav?`
<nav class="nav">
  ${tabs.map(t=>{
    if(t.id==="fab")return`<button class="fab" onclick="goAdd()">+</button>`;
    return`<button class="nav-btn ${S.tab===t.id?"active":""}" onclick="setTab('${t.id}')"><span class="ico">${t.ico}</span>${t.lbl}</button>`;
  }).join("")}
</nav>`:"";

  const modal=S.modal?renderModal():"";

  return`<div class="screen slide-up">${content}</div>${nav}${modal}`;
}

function initCharts(){
  const COLORS=["#7c6ef8","#ff5e7a","#2ecc8a","#f5c542","#06b6d4","#a855f7","#fb923c","#84cc16"];
  const isDark=S.theme!=="light";
  const gridC=isDark?"rgba(255,255,255,.08)":"rgba(0,0,0,.08)";
  const textC=isDark?"#8888aa":"#6b7280";

  // Category donut
  const catData={};
  S.transactions.filter(t=>t.type==="expense").forEach(t=>{catData[t.cat]=(catData[t.cat]||0)+t.amt;});
  const cEl=document.getElementById("chartExp");
  if(cEl){
    if(chartExp)chartExp.destroy();
    chartExp=new Chart(cEl,{
      type:"doughnut",
      data:{labels:Object.keys(catData),datasets:[{data:Object.values(catData),backgroundColor:COLORS,borderWidth:0,hoverOffset:8}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"65%",plugins:{legend:{position:"right",labels:{color:textC,font:{size:10},boxWidth:10,padding:8}},tooltip:{callbacks:{label:function(c){return` ${sym()}${fmt(c.parsed)}`;}}}}}
    });
  }

  // Monthly bar
  const mo=monthlyData();
  const labels=Object.keys(mo).sort().slice(-6).map(m=>{const[y,mn]=m.split("-");return MONTHS[parseInt(mn)-1];});
  const incVals=Object.keys(mo).sort().slice(-6).map(k=>mo[k].inc);
  const expVals=Object.keys(mo).sort().slice(-6).map(k=>mo[k].exp);
  const mEl=document.getElementById("chartMon");
  if(mEl){
    if(chartMon)chartMon.destroy();
    chartMon=new Chart(mEl,{
      type:"bar",
      data:{labels,datasets:[
        {label:"Income",data:incVals,backgroundColor:"rgba(46,204,138,.7)",borderRadius:6},
        {label:"Expense",data:expVals,backgroundColor:"rgba(255,94,122,.7)",borderRadius:6},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:textC,font:{size:11},boxWidth:12}}},scales:{x:{grid:{color:gridC},ticks:{color:textC,font:{size:10}}},y:{grid:{color:gridC},ticks:{color:textC,font:{size:10},callback:v=>`${sym()}${v>=1000?Math.round(v/1000)+"k":v}`}}}}
    });
  }
}

function renderBudget(){
  const totalBudget=S.budgets.reduce((a,b)=>a+b.limit,0);

  return`

  <div style="padding-top:50px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

  </div>

  <!-- Overview -->
  <div class="bal-card" style="margin-bottom:16px">
    <div style="font-size:11px;color:rgba(255,255,255,.7);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;position:relative;z-index:1">Total Budget</div>
    <div style="font-size:32px;font-weight:900;color:#fff;position:relative;z-index:1">${sym()}${fmt(totalBudget)}</div>
    <div style="margin-top:12px;position:relative;z-index:1">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.75);margin-bottom:6px">
        <span>Spent: ${sym()}${fmt(totalSpent)}</span>
        <span>Left: ${sym()}${fmt(Math.max(0,totalBudget-totalSpent))}</span>
      </div>
      <div style="height:8px;border-radius:4px;background:rgba(255,255,255,.2)">
        <div style="height:100%;border-radius:4px;background:${totalSpent/totalBudget>.9?"#ff5e7a":totalSpent/totalBudget>.7?"#f5c542":"#2ecc8a"};width:${Math.min(100,Math.round((totalSpent/totalBudget)*100))}%;transition:width .6s"></div>
      </div>
    </div>
  </div>

  <!-- Budget Items -->
  ${S.budgets.map((b,i)=>{
    const spent=catSpent(b.cat);
    const pct=Math.min(100,Math.round((spent/b.limit)*100));
    const over=spent>b.limit;
    const warn=pct>80&&!over;
    const catObj=EXP_CATS.find(c=>c.n===b.cat);
    return`
    <div class="card" style="margin-bottom:10px;border-color:${over?"var(--red)":warn?"var(--yel)":"var(--brd)"}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:22px">${catObj?.i||"📦"}</span>
          <div>
            <div style="font-size:14px;font-weight:700">${b.cat}</div>
            <div style="font-size:11px;color:var(--sub)">${sym()}${fmt(spent)} / ${sym()}${fmt(b.limit)}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:900;color:${over?"var(--red)":warn?"var(--yel)":"var(--grn)"}">${pct}%</div>
          ${over?`<div style="font-size:9px;color:var(--red);font-weight:700">OVER BUDGET</div>`:""}
          ${warn&&!over?`<div style="font-size:9px;color:var(--yel);font-weight:700">NEAR LIMIT</div>`:""}
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${over?"var(--red)":warn?"var(--yel)":"linear-gradient(90deg,var(--acc),#a855f7)"}"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button onclick="editBudgetItem(${i})" class="btn btn-outline btn-sm" style="flex:1;padding:7px">✏️ Edit</button>
        <button onclick="deleteBudget(${i})" class="btn btn-sm" style="flex:1;padding:7px;background:var(--card2);color:var(--sub)">🗑️ Remove</button>
      </div>
    </div>`;
  }).join("")}
  ${S.budgets.length===0?`<div class="empty"><div class="ico">🎯</div><div>No budgets set</div><div style="font-size:12px;margin-top:6px">Tap + Add to create one</div></div>`:""}
</div>`;
}

    <button class="btn" onclick="closeModal()" style="background:var(--card2);color:var(--sub)">Cancel</button>`;

  return`
<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal slide-up">${content}</div>
</div>`;
}

// ═══════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════
function attachEvents(){
  // Prevent body scroll
  document.querySelectorAll(".screen").forEach(el=>{
    el.addEventListener("touchmove",e=>e.stopPropagation(),{passive:true});
  });
}

// PIN
function pinTap(d){
  if(S.pinEntry.length>=4)return;
  S.pinEntry+=String(d);
  updatePinDots();
  if(S.pinEntry.length===4){
    if(S.pinEntry===S.pin){
      setTimeout(()=>{S.screen="home";S.tab="home";S.pinEntry="";render();},200);
    }else{
      S.pinError=true;
      updatePinDots();
      setTimeout(()=>{S.pinEntry="";S.pinError=false;updatePinDots();},700);
    }
  }
}
function pinDel(){S.pinEntry=S.pinEntry.slice(0,-1);updatePinDots();}
function pinBio(){S.screen="home";S.tab="home";render();}
function updatePinDots(){
  const el=document.getElementById("pin-dots");
  if(!el)return;
  el.innerHTML=[0,1,2,3].map(i=>`<div class="pin-dot" style="border:2.5px solid ${i<S.pinEntry.length?(S.pinError?"var(--red)":"var(--acc)"):(S.pinError?"var(--red)":"var(--brd)")};background:${i<S.pinEntry.length?(S.pinError?"var(--red)":"var(--acc)"):"transparent"};${S.pinError?"animation:shake .4s ease":""}"></div>`).join("");
}

// Navigation
function goScreen(s){S.screen=s;render();}
function setTab(t){S.screen="home";S.tab=t;render();}
function goTab(t){S.screen="home";S.tab=t;render();}
function goAdd(){S.screen="add";S.addForm={type:"expense",cat:"",sub:"",amt:"",note:"",acc:S.accounts[0]?.name||"",date:today()};render();}

// Theme
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";saveState();render();}
function setTheme(t){S.theme=t;saveState();render();}

// Add transaction
function setAddType(t){S.addForm.type=t;S.addForm.cat="";S.addForm.sub="";render();}
function saveTxn(){
  const f=S.addForm;
  if(!f.amt||isNaN(f.amt)||parseFloat(f.amt)<=0){alert("Enter a valid amount!");return;}
  if(!f.cat){alert("Select a category!");return;}
  const cats=f.type==="expense"?EXP_CATS:INC_CATS;
  const catObj=cats.find(c=>c.n===f.cat);
  const id=Date.now();
  S.transactions.unshift({id,type:f.type,cat:f.cat,sub:f.sub,amt:parseFloat(f.amt),acc:f.acc,note:f.note,date:f.date||today(),icon:catObj?.i||"💰"});
  // Update account balance
  const acc=S.accounts.find(a=>a.name===f.acc);
  if(acc){if(f.type==="income")acc.bal+=parseFloat(f.amt);else acc.bal-=parseFloat(f.amt);}
  saveState();
  S.screen="home";S.tab="home";
  render();
}

// Budget
function openAddBudget(){S.newBudgetCat="";S.newBudgetLimit="";openModal("add-budget");}
function saveBudget(){
  if(!S.newBudgetCat||!S.newBudgetLimit){alert("Fill all fields!");return;}
  const existing=S.budgets.findIndex(b=>b.cat===S.newBudgetCat);
  if(existing>=0){S.budgets[existing].limit=parseFloat(S.newBudgetLimit);}
  else{S.budgets.push({cat:S.newBudgetCat,limit:parseFloat(S.newBudgetLimit)});}
  saveState();closeModal();render();
}
function editBudgetItem(i){
  S.newBudgetCat=S.budgets[i].cat;
  S.newBudgetLimit=String(S.budgets[i].limit);
  openModal("add-budget");
}
function deleteBudget(i){if(confirm("Remove this budget?")){{S.budgets.splice(i,1);saveState();render();}}}

// Accounts
function saveAccount(){
  const f=S.addAccForm;
  if(!f.name){alert("Enter account name!");return;}
  const typeObj=ACC_TYPES.find(t=>t.t===f.type);
  S.accounts.push({id:Date.now(),name:f.name,type:f.type,bal:parseFloat(f.bal)||0,icon:typeObj?.i||"🏦",color:"#7c6ef8"});
  saveState();closeModal();render();
}
function deleteAccount(i){if(confirm("Remove this account?")){S.accounts.splice(i,1);saveState();render();}}

// Goals
function saveGoal(){
  const f=S.newGoalForm;
  if(!f.name||!f.target){alert("Fill required fields!");return;}
  const colors=["#7c6ef8","#2ecc8a","#f5c542","#ff5e7a","#06b6d4","#a855f7"];
  S.goals.push({id:Date.now(),name:f.name,target:parseFloat(f.target),saved:parseFloat(f.saved)||0,icon:f.icon||"🎁",color:colors[S.goals.length%colors.length]});
  saveState();closeModal();render();
}
function addToGoal(i){
  const amt=prompt(`Add amount to "${S.goals[i].name}" (${sym()})`);
  if(amt&&!isNaN(amt)&&parseFloat(amt)>0){
    S.goals[i].saved=Math.min(S.goals[i].target,S.goals[i].saved+parseFloat(amt));
    saveState();render();
  }
}
function deleteGoal(i){if(confirm("Remove this goal?")){S.goals.splice(i,1);saveState();render();}}

// Recurring
function deleteRecurring(i){if(confirm("Remove recurring bill?")){S.recurring.splice(i,1);saveState();render();}}

// Transactions
function deleteTxnConfirm(id){
  if(confirm("Delete this transaction?")){
    const t=S.transactions.find(x=>x.id===id);
    if(t){
      const acc=S.accounts.find(a=>a.name===t.acc);
      if(acc){if(t.type==="income")acc.bal-=t.amt;else acc.bal+=t.amt;}
    }
    S.transactions=S.transactions.filter(t=>t.id!==id);
    saveState();render();
  }
}

// PIN change
function changePin(){
  const old=document.getElementById("old-pin")?.value;
  const nw=document.getElementById("new-pin")?.value;
  if(old!==S.pin){alert("Wrong current PIN!");return;}
  if(!nw||nw.length!==4||isNaN(nw)){alert("New PIN must be 4 digits!");return;}
  S.pin=nw;saveState();closeModal();alert("PIN updated successfully!");
}

// Modal
function openModal(m){S.modal=m;render();}
function closeModal(){S.modal=null;render();}

// Scanner
function openScanner(){openModal("scanner");}
function handleBillScan(input){
  if(input.files&&input.files[0]){
    closeModal();
    setTimeout(()=>{
      alert("Bill scanned! (Demo: auto-filling sample data)");
      S.screen="add";
      S.addForm={type:"expense",cat:"Food & Dining",sub:"Restaurant",amt:"450",note:"Scanned receipt",acc:S.accounts[0]?.name||"",date:today()};
      render();
    },500);
  }
}

// Export
function exportData(){
  const data=JSON.stringify({transactions:S.transactions,accounts:S.accounts,budgets:S.budgets,goals:S.goals},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="cashchecker_backup.json";a.click();
  URL.revokeObjectURL(url);
}

// PWA SETUP
// ═══════════════════════════════════════════
const manifest={
  name:"CashcheckeR",short_name:"CashcheckeR",
  start_url:".",display:"standalone",
  background_color:"#0a0a0f",theme_color:"#7c6ef8",
  description:"Smart Personal Finance Manager",
  icons:[
    {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c6ef8'/><text y='.9em' font-size='70' x='10'>₹</text></svg>",sizes:"192x192",type:"image/svg+xml"},
    {src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c6ef8'/><text y='.9em' font-size='70' x='10'>₹</text></svg>",sizes:"512x512",type:"image/svg+xml"}
  ]
};
const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
const manifestURL=URL.createObjectURL(blob);
const link=document.createElement("link");
link.rel="manifest";link.href=manifestURL;
document.head.appendChild(link);

if("serviceWorker" in navigator){
  const swCode=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));
`;
  const swBlob=new Blob([swCode],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

// INIT
// ═══════════════════════════════════════════
render();
</script>
