<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d17" />
<meta name="description" content="Cash Checker — an intelligent personal & business financial operating system." />
<title>Cash Checker</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- ══════════════ BOOT SPLASH ══════════════ -->
<div id="splash" class="splash">
  <div class="splash-mark">
    <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient></defs>
      <path fill="url(#sg)" d="M24 3 43 13v22L24 45 5 35V13z"/>
      <path fill="#0b0d17" opacity=".85" d="M24 12c-6 0-11 3.6-11 8s5 8 11 8 11 3.6 11 8-5 8-11 8"/>
      <path stroke="#fff" stroke-width="2.6" stroke-linecap="round" d="M24 8v32"/>
    </svg>
  </div>
  <div class="splash-name">Cash Checker</div>
  <div class="splash-bar"><i></i></div>
</div>

<!-- ══════════════ LANDING / AUTH ══════════════ -->
<div id="landing" class="landing" hidden></div>

<!-- ══════════════ LOCK SCREEN ══════════════ -->
<div id="lock" class="lock" hidden>
  <div class="lock-card glass">
    <div class="lock-logo">
      <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
        <use href="#i-shield"/>
      </svg>
    </div>
    <h1 class="lock-title">Vault locked</h1>
    <p class="lock-sub" id="lock-sub">Enter your PIN to unlock</p>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-pad" id="pin-pad"></div>
    <div class="lock-actions">
      <button class="btn ghost sm" id="lock-bio" hidden>Use biometrics</button>
      <button class="btn ghost sm danger" id="lock-reset">Forgot PIN</button>
    </div>
    <p class="lock-err" id="lock-err" role="alert"></p>
  </div>
</div>

<!-- ══════════════ APP SHELL ══════════════ -->
<div id="app" class="app" hidden>

  <aside id="drawer" class="drawer" aria-label="Main navigation">
    <div class="drawer-head">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">
          <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><use href="#i-logo"/></svg>
        </span>
        <span class="brand-text">
          <b>Cash Checker</b>
          <small id="brand-sub">Financial OS</small>
        </span>
      </a>
      <button class="icon-btn drawer-close" id="drawer-close" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-x"/></svg>
      </button>
    </div>

    <a class="drawer-profile" id="drawer-profile" href="#/settings" title="Edit your profile"></a>

    <div class="drawer-net" id="drawer-net"></div>

    <nav class="nav" id="nav"></nav>

    <div class="drawer-foot">
      <div class="sync-pill" id="sync-pill" title="Storage status">
        <span class="dot"></span><span id="sync-text">Local · synced</span>
      </div>
      <div class="ver">v<span id="app-ver">1.0.0</span></div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="22" height="22"><use href="#i-menu"/></svg>
      </button>

      <div class="crumbs">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub"></p>
      </div>

      <button class="searchbar" id="search-open" aria-label="Open global search">
        <svg viewBox="0 0 24 24" width="17" height="17"><use href="#i-search"/></svg>
        <span>Search anything…</span>
        <kbd>Ctrl</kbd><kbd>K</kbd>
      </button>

      <div class="topbar-actions">
        <button class="icon-btn only-mobile" id="search-open-m" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-search"/></svg>
        </button>
        <button class="btn primary add-btn" id="quick-add">
          <svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-plus"/></svg>
          <span>Add</span>
        </button>
        <button class="icon-btn" id="bell" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-bell"/></svg>
          <span class="badge" id="bell-badge" hidden>0</span>
        </button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-moon"/></svg>
        </button>
        <button class="icon-btn" id="lock-btn" aria-label="Lock app">
          <svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-lock"/></svg>
        </button>
      </div>
    </header>

    <div class="view-wrap">
      <main id="view" class="view" tabindex="-1"></main>
      <footer class="app-foot">
        <span>Cash Checker · local-first financial operating system</span>
        <span id="foot-stats"></span>
      </footer>
    </div>
  </div>
</div>

<!-- ══════════════ OVERLAYS ══════════════ -->
<div id="cmdk" class="cmdk" hidden>
  <div class="cmdk-box glass">
    <div class="cmdk-input">
      <svg viewBox="0 0 24 24" width="18" height="18"><use href="#i-search"/></svg>
      <input id="cmdk-q" type="text" placeholder="Search transactions, people, investments — or ask “how much did I spend on food last month”" autocomplete="off" spellcheck="false"/>
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-results" id="cmdk-results"></div>
    <div class="cmdk-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span id="cmdk-count"></span>
    </div>
  </div>
</div>

<div id="drop-hint" class="drop-hint" hidden><div>Drop file to import</div></div>
<div id="modal-root"></div>
<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<!-- ══════════════ ICON SPRITE ══════════════ -->
<svg style="display:none" aria-hidden="true">

</html>
